# ============================================================
#  Edge AI - Docker Compose 编排文件（公共 Broker 模式）
#
#  一键启动: docker-compose up -d --build
#
#  服务架构（使用公共 Broker，无需本地 Mosquitto）:
#    摄像头 → [yolo-service] → test.mosquitto.org → [dashboard] → 浏览器
#
#  访问地址:
#    告警面板: http://localhost:5000
# ============================================================

services:

  # ==================== YOLO 目标检测服务 ====================
  yolo-service:
    build:
      context: .
      dockerfile: docker/yolo/Dockerfile
    container_name: edgeai-yolo
    restart: unless-stopped
    environment:
      - MQTT_BROKER=test.mosquitto.org   # 公共 Broker（无需本地拉取）
      - MQTT_PORT=1883
      - MQTT_TOPIC=edgeai/alerts
      - CAMERA_DEVICE=/dev/video0
      - MODEL_PATH=/app/models/yolov8n_int8.tflite
      - COOLDOWN_SEC=5
    devices:
      - "/dev/video0:/dev/video0"
    networks:
      - edgeai-net

  # ==================== Flask 告警仪表盘 ====================
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: edgeai-dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MQTT_BROKER=test.mosquitto.org   # 公共 Broker（无需本地拉取）
      - MQTT_PORT=1883
      - MQTT_TOPIC=edgeai/alerts
      - WEB_PORT=5000
      - MAX_ALERTS=50
    networks:
      - edgeai-net

# ==================== 网络配置 ====================
networks:
  edgeai-net:
    driver: bridge
