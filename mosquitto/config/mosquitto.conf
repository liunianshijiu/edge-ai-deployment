# ============================================================
#  Mosquitto MQTT Broker 配置
#  用途: EdgeAI 项目本地消息中转
# ============================================================

# 监听端口
listener 1883

# 允许匿名连接（开发环境用，生产环境需开启认证）
allow_anonymous true

# 持久化: 将 in-flight 消息写入磁盘
persistence true
persistence_location /mosquitto/data/

# 日志输出
log_dest file /mosquitto/log/mosquitto.log
log_type all

# WebSocket 支持（可选，给前端直连 MQTT 用）
listener 9001
protocol websocket
