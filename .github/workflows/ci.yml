name: Edge AI CI/CD

# 触发条件：push 到 main 分支时运行
on:
  push:
    branches:
      - main

# 权限设置
permissions:
  contents: write  # 读取代码 + 创建 Release 需要写权限

# 工作流 jobs
jobs:
  # ==================== 1. 代码检查（flake8） ====================
  lint:
    runs-on: ubuntu-latest  # 使用 Ubuntu 虚拟机
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
      
      - name: 运行代码检查
        run: |
          flake8 api/ docker/ day*.py
        continue-on-error: false  # 代码检查失败则整个工作流失败

  # ==================== 2. 单元测试 ====================
  test:
    runs-on: ubuntu-latest
    needs: lint  # 等待代码检查完成
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-api.txt
          pip install pytest pytest-cov httpx
      
      - name: 运行单元测试
        run: |
          pytest api/tests/ -v --cov=api
        continue-on-error: false  # 测试失败则工作流失败

  # ==================== 3. 自动生成 Release（可选） ====================
  release:
    runs-on: ubuntu-latest
    needs: test  # 等待测试完成
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 生成 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}  # 使用分支名作为 tag
          name: "Edge AI Release ${{ github.ref_name }}"
          generate_release_notes: true  # 自动根据 commit 生成发布说明
          draft: false
          prerelease: false

# ==================== 工作流总结 ====================
# 1. push 到 main 分支 → 自动触发
# 2. 代码检查(lint) → 单元测试(test) → （可选）自动 Release
# 3. 任何一步失败都会终止工作流，保证代码质量
# 4. Docker 构建步骤已移除（国内连 Docker Hub 不稳定，且无需登录密钥）
# 5. Release 为可选步骤，自动根据 commit 生成说明，无需额外配置 Secrets