name: Edge AI CI/CD

# 触发条件：push 到 main 分支时运行
on:
  push:
    branches:
      - main

# 权限设置（GitHub Actions 需要���权限）
permissions:
  contents: read  # 读取仓库内容
  packages: write # 发布 Docker 镜像（如果用）
  id-token: write # 用于 OIDC 认证（可选）

# 工作流 jobs
jobs:
  # ==================== 1. 代码检查（flake8） ====================
  lint:
    runs-on: ubuntu-latest  # 使用 Ubuntu 虚拟机
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
      
      - name: 运行代码检查
        run: |
          flake8 api/ docker/ day*.py
        continue-on-error: false  # 代码检查失败则整个工作流失败

  # ==================== 2. 单元测试 ====================
  test:
    runs-on: ubuntu-latest
    needs: lint  # 等待代码检查完成
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-api.txt
          pip install pytest pytest-cov
      
      - name: 运行单元测试
        run: |
          pytest api/test_api.py -v --cov=api
        continue-on-error: false  # 测试失败则工作流失败

  # ==================== 3. Docker 构建与部署（可选，网络通时启用） ====================
  docker-build:
    runs-on: ubuntu-latest
    needs: test  # 等待测试完成
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # 仅在 main 分支 push 时运行
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: 构建并推送 YOLO 服务镜像
        uses: docker/build-push-action@v5
        with:
          context: docker/yolo
          push: true
          tags: |
            your-dockerhub-username/edgeai-yolo:latest
            your-dockerhub-username/edgeai-yolo:${{ github.sha }}
      
      - name: 构建并推送 Dashboard 镜像
        uses: docker/build-push-action@v5
        with:
          context: docker/dashboard
          push: true
          tags: |
            your-dockerhub-username/edgeai-dashboard:latest
            your-dockerhub-username/edgeai-dashboard:${{ github.sha }}

  # ==================== 4. 自动生成 Release（可选） ====================
  release:
    runs-on: ubuntu-latest
    needs: test  # 等待测试完成
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 生成 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}  # 使用分支名作为 tag
          name: "Edge AI Release ${{ github.ref_name }}"
          body_path: CHANGELOG.md  # 可选：使用 CHANGELOG.md 作为发布说明
          draft: false
          prerelease: false

# ==================== 工作流总结 ====================
# 1. push 到 main 分支 → 自动触发
# 2. 代码检查 → 单元测试 → （可选）Docker 构建与部署 → （可选）自动 Release
# 3. 任何一步失败都会终止工作流，保证代码质量
# 4. 需要配置 GitHub Secrets：DOCKER_HUB_USERNAME 和 DOCKER_HUB_TOKEN